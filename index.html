
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOA 2.0 - Personal Assistant</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080d18;
 color:white;
 min-height:100vh;
}
header{
 padding:22px 20px;
 text-align:center;
 background:#101a2b;
 border-bottom:1px solid #26344a;
}
header h2{margin:0;color:#fff;letter-spacing:3px}
header p{margin:8px 0 0;color:#aabbd0;font-size:14px}
nav{
 display:flex;
 justify-content:center;
 gap:12px;
 padding:15px;
}
nav button{
 background:#192840;
 color:white;
 border:1px solid #354967;
 border-radius:20px;
 padding:11px 22px;
 cursor:pointer;
}
nav button.active{background:#b38b43;color:#080d18}
.page{
 display:none;
 padding:25px 20px 120px;
 max-width:650px;
 margin:auto;
 text-align:center;
}
.page.active{display:block}
.welcome{
 margin-top:45px;
 font-size:25px;
 font-weight:bold;
}
.subtitle{color:#aabbd0;margin-top:12px}
.mic-area{
 display:flex;
 justify-content:center;
 margin:55px auto 25px;
}
.mic{
 width:125px;
 height:125px;
 border-radius:50%;
 border:3px solid #d2ae68;
 background:linear-gradient(145deg,#263a56,#101a2b);
 color:#e5bd72;
 font-size:48px;
 cursor:pointer;
 box-shadow:0 0 35px #b38b4440;
}
.mic.listening{
 animation:pulse 1.2s infinite;
 background:#a13c42;
 color:white;
}
@keyframes pulse{
 50%{box-shadow:0 0 45px #ff5353}
}
.status{color:#d8b776;font-size:14px;margin:18px}
.message{
 background:#142238;
 border:1px solid #293e5c;
 padding:17px;
 border-radius:14px;
 margin:20px auto;
 text-align:left;
 line-height:1.6;
 min-height:55px;
}
.input-area{
 display:flex;
 gap:8px;
 margin-top:20px;
}
input{
 flex:1;
 min-width:0;
 padding:14px;
 border-radius:10px;
 border:1px solid #344b69;
 background:#142238;
 color:white;
 font-size:15px;
}
.send{
 padding:12px 17px;
 background:#b38b43;
 color:#111;
 border:0;
 border-radius:10px;
 cursor:pointer;
}
.record{
 background:#142238;
 border:1px solid #293e5c;
 padding:15px;
 border-radius:12px;
 margin:12px 0;
 text-align:left;
}
.record small{color:#9eb0c8}
.delete{
 background:#803c43;
 color:white;
 border:0;
 padding:8px 12px;
 border-radius:8px;
 margin-top:8px;
}
.bottom-mic{
 position:fixed;
 bottom:15px;
 left:50%;
 transform:translateX(-50%);
 background:#b38b43;
 color:#101722;
 border:3px solid #e5c98c;
 width:65px;
 height:65px;
 border-radius:50%;
 font-size:27px;
 cursor:pointer;
 box-shadow:0 0 25px #b38b4460;
 z-index:10;
}
footer{
 text-align:center;
 color:#657890;
 font-size:12px;
 padding:15px;
}
</style>
</head>

<body>

<header>
<h2>DOA 2.0</h2>
<p>Your intelligent personal assistant</p>
</header>

<nav>
<button class="active" onclick="openPage('home',this)">Home</button>
<button onclick="openPage('records',this)">Records</button>
</nav>

<section id="home" class="page active">

<div class="welcome">
Welcome to DOA,<br>
your best personal assistant.
</div>

<div class="subtitle">
I'm ready to listen. What can I do for you?
</div>

<div class="mic-area">
<button class="mic" id="mainMic" onclick="toggleMic()">🎙</button>
</div>

<div class="status" id="status">
Tap the microphone and talk to DOA.
</div>

<div class="message" id="conversation">
<strong>DOA:</strong> Hello! How can I help you today?
</div>

<div class="input-area">
<input id="userInput" placeholder="Type your instruction...">
<button class="send" onclick="sendText()">Send</button>
</div>

</section>

<section id="records" class="page">

<h2>My Records</h2>
<p class="subtitle">Your saved information and records.</p>

<div class="input-area">
<input id="recordInput" placeholder="Enter a record...">
<button class="send" onclick="saveRecord()">Save</button>
</div>

<div id="recordList"></div>

</section>

<button class="bottom-mic" onclick="toggleMic()" title="Talk to DOA">🎙</button>

<footer>
DOA 2.0 | Your personal assistant
</footer>

<script>
let recognition;
let listening = false;
let currentPage = "home";

const statusBox = document.getElementById("status");
const conversation = document.getElementById("conversation");
const mainMic = document.getElementById("mainMic");

function openPage(page,button){
 document.querySelectorAll(".page").forEach(p=>{
  p.classList.remove("active");
 });
 document.getElementById(page).classList.add("active");
 document.querySelectorAll("nav button").forEach(b=>{
  b.classList.remove("active");
 });
 if(button) button.classList.add("active");
 currentPage=page;
 if(page==="records") loadRecords();
}

function speak(text){
 if(!("speechSynthesis" in window)) return;
 window.speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(text);
 speech.lang="en-US";
 speech.rate=1;
 speech.pitch=1;
 window.speechSynthesis.speak(speech);
}

function reply(text){
 conversation.innerHTML="<strong>DOA:</strong> "+escapeHTML(text);
 speak(text);
}

function escapeHTML(text){
 return String(text).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function toggleMic(){
 if(listening){
  recognition?.stop();
  return;
 }

 const SpeechRecognition=
 window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  reply("Voice recognition is not supported in this browser. Please use Chrome on your phone.");
  return;
 }

 recognition=new SpeechRecognition();
 recognition.lang="en-US";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  listening=true;
  mainMic.classList.add("listening");
  statusBox.innerText="DOA is listening...";
 };

 recognition.onresult=(event)=>{
  const words=event.results[0][0].transcript;
  conversation.innerHTML="<strong>You:</strong> "+escapeHTML(words);
  processInstruction(words);
 };

 recognition.onerror=()=>{
  statusBox.innerText="I couldn't hear you. Please try again.";
 };

 recognition.onend=()=>{
  listening=false;
  mainMic.classList.remove("listening");
  statusBox.innerText="Tap the microphone to speak again.";
 };

 recognition.start();
}

function sendText(){
 const input=document.getElementById("userInput");
 const words=input.value.trim();
 if(!words)return;
 conversation.innerHTML="<strong>You:</strong> "+escapeHTML(words);
 input.value="";
 processInstruction(words);
}

document.getElementById("userInput")
.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendText();
});

function processInstruction(text){
 const command=text.toLowerCase().trim();

 if(command.includes("open records") ||
    command.includes("show records") ||
    command.includes("go to records")){
  openPage("records",document.querySelectorAll("nav button")[1]);
  reply("Opening your records.");
  return;
 }

 if(command.includes("open home") ||
    command.includes("go home")){
  openPage("home",document.querySelectorAll("nav button")[0]);
  reply("Welcome back to your home page.");
  return;
 }

 if(command.startsWith("save record")){
  const value=text.replace(/save record/i,"").trim();
  if(value){
   addRecord(value);
   reply("Your record has been saved.");
  }else{
   reply("Please tell me what you want me to save.");
  }
  return;
 }

 if(command.includes("read records") ||
    command.includes("list records")){
  openPage("records",document.querySelectorAll("nav button")[1]);
  const records=JSON.parse(localStorage.getItem("doaRecords")||"[]");
  reply(records.length?
   "You have "+records.length+" saved records.":
   "You do not have any saved records yet.");
  return;
 }

 if(command.includes("clear records")){
  localStorage.removeItem("doaRecords");
  loadRecords();
  reply("All records have been cleared.");
  return;
 }

 if(command.includes("hello") ||
    command.includes("good morning") ||
    command.includes("good afternoon")){
  reply("Hello! I'm DOA, your personal assistant. How may I help you?");
  return;
 }

 reply("I have received your instruction: "+text+
 " My AI assistant connection is not yet configured. I can currently handle basic navigation and record commands.");
}

function addRecord(value){
 const records=JSON.parse(localStorage.getItem("doaRecords")||"[]");
 records.push({
  text:value,
  date:new Date().toLocaleString()
 });
 localStorage.setItem("doaRecords",JSON.stringify(records));
 loadRecords();
}

function saveRecord(){
 const input=document.getElementById("recordInput");
 if(!input.value.trim())return;
 addRecord(input.value.trim());
 input.value="";
 reply("Your record has been saved.");
}

function loadRecords(){
 const records=JSON.parse(localStorage.getItem("doaRecords")||"[]");
 const list=document.getElementById("recordList");

 if(!records.length){
  list.innerHTML="<p class='subtitle'>No records saved yet.</p>";
  return;
 }

 list.innerHTML=records.map((r,i)=>`
 <div class="record">
 <strong>${escapeHTML(r.text)}</strong><br>
 <small>${escapeHTML(r.date)}</small><br>
 <button class="delete" onclick="deleteRecord(${i})">Delete</button>
 </div>
 `).join("");
}

function deleteRecord(index){
 const records=JSON.parse(localStorage.getItem("doaRecords")||"[]");
 records.splice(index,1);
 localStorage.setItem("doaRecords",JSON.stringify(records));
 loadRecords();
}
 
loadRecords();
</script>

</body>
</html>
