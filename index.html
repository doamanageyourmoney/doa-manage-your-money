
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>DOA 3.0 | Personal Assistant</title>

<style>
:root {
  --bg:#080d18;
  --panel:#101a2b;
  --panel2:#142138;
  --blue:#548cff;
  --cyan:#54d8e8;
  --text:#f4f7ff;
  --muted:#91a0b8;
  --border:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:radial-gradient(ellipse at 50% -20%,#1c3761 0%,#080d18 58%);
  color:var(--text);
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  max-width:1100px;
  margin:auto;
  padding:20px;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 0 22px;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:15px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#548cff,#42d4e7);
  color:white;font-size:22px;font-weight:900;
  box-shadow:0 5px 30px #367cff55;
}
.brand h2{margin:0;font-size:21px;letter-spacing:2px}
.brand small{display:block;color:var(--muted);margin-top:4px}
.status{
  font-size:12px;color:#73e6bb;
  background:#14372e;padding:8px 12px;
  border-radius:30px;
}
.status:before{content:"● ";font-size:9px}
main{
  flex:1;display:flex;flex-direction:column;
  width:100%;max-width:850px;margin:0 auto;
}
.welcome{text-align:center;padding:65px 15px 35px}
.orb{
  width:92px;height:92px;border-radius:28px;
  margin:0 auto 25px;
  display:grid;place-items:center;
  font-size:39px;
  background:linear-gradient(145deg,#264f8e,#10213d);
  border:1px solid #6da2ff55;
  box-shadow:0 0 60px #367cff35;
}
.welcome h1{font-size:clamp(29px,6vw,43px);margin:0 0 13px}
.welcome h1 span{
  background:linear-gradient(90deg,#73a8ff,#57dce7);
  -webkit-background-clip:text;color:transparent;
}
.welcome p{
  color:var(--muted);font-size:15px;
  line-height:1.7;max-width:480px;margin:auto;
}
.suggestions{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:12px;margin:0 auto 25px;width:100%;
}
.suggestion{
  text-align:left;background:#101b2d;
  border:1px solid var(--border);color:var(--text);
  padding:17px;border-radius:15px;
  transition:.2s;
}
.suggestion:hover{border-color:#548cff;transform:translateY(-2px)}
.suggestion strong{display:block;font-size:14px;margin-bottom:7px}
.suggestion small{color:var(--muted);font-size:12px}
#chat{
  flex:1;display:none;flex-direction:column;
  gap:18px;padding:20px 0;
}
.message{display:flex;gap:11px;align-items:flex-start}
.avatar{
  flex-shrink:0;width:35px;height:35px;
  display:grid;place-items:center;border-radius:12px;
  background:#1b3153;font-size:14px;font-weight:bold;
}
.message.user .avatar{background:#2854a0}
.bubble{
  max-width:85%;padding:14px 16px;
  border-radius:5px 16px 16px 16px;
  background:#142138;border:1px solid var(--border);
  font-size:14px;line-height:1.7;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.message.user{flex-direction:row-reverse}
.message.user .bubble{
  background:linear-gradient(135deg,#2454a0,#193b70);
  border-radius:16px 5px 16px 16px;
}
.typing{color:var(--cyan);font-size:13px;padding:8px}
.composer{
  position:sticky;bottom:0;
  padding:14px 0 8px;
  background:linear-gradient(transparent,#080d18 20%);
}
.inputbox{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:#121e31;border:1px solid #314866;
  border-radius:19px;
  box-shadow:0 12px 40px #0005;
}
.inputbox:focus-within{border-color:var(--blue)}
.inputbox input{
  flex:1;min-width:0;background:transparent;
  border:0;outline:0;color:white;
  padding:10px 3px;font-size:15px;
}
.inputbox input::placeholder{color:#8292ab}
.action{
  width:43px;height:43px;border:0;border-radius:13px;
  color:white;background:#263c5c;font-size:18px;
}
.send{
  background:linear-gradient(135deg,#548cff,#3970d6);
}
.send:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;color:#73839b;font-size:11px;margin-top:12px}
footer{text-align:center;color:#63728a;font-size:11px;padding:18px 0}
.newchat{
  color:#c5d7f7;background:#172640;
  border:1px solid var(--border);
  padding:10px 14px;border-radius:12px;font-size:12px;
}
@media(max-width:550px){
 .app{padding:14px}
 header{padding-bottom:16px}
 .brand h2{font-size:18px}
 .welcome{padding-top:48px}
 .suggestions{grid-template-columns:1fr}
 .bubble{max-width:88%;font-size:13px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">D</div>
    <div>
      <h2>DOA</h2>
      <small>PERSONAL AI ASSISTANT · 3.0</small>
    </div>
  </div>
  <button class="newchat" onclick="newChat()">＋ New chat</button>
</header>

<main>
  <section class="welcome" id="welcome">
    <div class="orb">✦</div>
    <h1>Welcome to <span>DOA</span></h1>
    <p>Your best personal assistant. Think, plan, create and get things done with intelligent assistance.</p>
  </section>

  <section class="suggestions" id="suggestions">
    <button class="suggestion" onclick="ask('Help me plan my day')">
      <strong>✦ Plan my day</strong>
      <small>Organise tasks and priorities</small>
    </button>
    <button class="suggestion" onclick="ask('Help me solve a problem')">
      <strong>◈ Solve a problem</strong>
      <small>Think through difficult decisions</small>
    </button>
    <button class="suggestion" onclick="ask('Help me write something professionally')">
      <strong>✎ Writing assistant</strong>
      <small>Create professional content</small>
    </button>
    <button class="suggestion" onclick="ask('Give me business ideas')">
      <strong>⌘ Business ideas</strong>
      <small>Explore opportunities and strategies</small>
    </button>
  </section>

  <section id="chat"></section>

  <div class="composer">
    <div class="inputbox">
      <button class="action" title="Voice input coming later" onclick="alert('Microphone upgrade coming soon.')">🎙</button>
      <input id="prompt" type="text" placeholder="Ask DOA anything..." autocomplete="off">
      <button class="action send" id="send" onclick="sendMessage()">➤</button>
    </div>
    <div class="hint">DOA 3.0 · Your thoughts, your assistant</div>
  </div>
</main>

<footer>DOA 3.0 · PERSONAL INTELLIGENCE</footer>
</div>

<script>
const WORKER_URL =
 "https://soft-frog-4cf8.doa2026app.workers.dev/";

const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const welcome = document.getElementById("welcome");
const suggestions = document.getElementById("suggestions");

let history = [];
let busy = false;

function showChat(){
 welcome.style.display="none";
 suggestions.style.display="none";
 chat.style.display="flex";
}

function addMessage(role,text){
 const row=document.createElement("div");
 row.className="message "+role;

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=role==="user"?"Y":"D";

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;

 row.append(avatar,bubble);
 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;
 return row;
}

function ask(text){
 promptBox.value=text;
 sendMessage();
}

async function sendMessage(){
 const message=promptBox.value.trim();
 if(!message || busy)return;

 showChat();
 addMessage("user",message);
 promptBox.value="";
 busy=true;
 sendButton.disabled=true;

 const typing=addMessage("assistant","DOA is thinking...");
 typing.querySelector(".bubble").classList.add("typing");

 try{
   const response=await fetch(WORKER_URL,{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       message:message,
       prompt:message,
       history:history,
       messages:history
     })
   });

   const raw=await response.text();
   let data;

   try{
     data=JSON.parse(raw);
   }catch{
     throw new Error("The AI server returned an unexpected response.");
   }

   if(!response.ok){
     throw new Error(data.error || data.message || "Server error: "+response.status);
   }

   const answer=typeof data==="string"
     ?data
     :(data.reply || data.response || data.answer ||
       data.text || data.output ||
       data.result?.response || data.result?.text);

   if(!answer){
     throw new Error(data.error || "No answer was received from the AI server.");
   }

   typing.querySelector(".bubble").textContent=answer;
   typing.querySelector(".bubble").classList.remove("typing");

   history.push(
     {role:"user",content:message},
     {role:"assistant",content:answer}
   );

 }catch(error){
   typing.querySelector(".bubble").textContent=
     "I'm having trouble connecting right now. Please try again.\n\n"+error.message;
   typing.querySelector(".bubble").classList.remove("typing");
 }finally{
   busy=false;
   sendButton.disabled=false;
   promptBox.focus();
   chat.scrollTop=chat.scrollHeight;
 }
}

function newChat(){
 history=[];
 chat.innerHTML="";
 chat.style.display="none";
 welcome.style.display="block";
 suggestions.style.display="grid";
 promptBox.value="";
}

promptBox.addEventListener("keydown",function(e){
 if(e.key==="Enter" && !e.shiftKey){
   e.preventDefault();
   sendMessage();
 }
});
</script>
</body>
</html>
