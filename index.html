
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>DOA 3.0 - Your Personal Assistant</title>

<style>
:root {
  --bg:#071426;
  --panel:#0d2036;
  --panel2:#102943;
  --cyan:#35d6ee;
  --blue:#3188ff;
  --text:#edf6ff;
  --muted:#91a9c2;
  --border:rgba(151,190,225,.16);
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at top,#12365a,#071426 65%);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.app {
  max-width:950px;
  height:100vh;
  height:100dvh;
  margin:auto;
  padding:0 15px;
  display:flex;
  flex-direction:column;
}

header {
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
}

.logo {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,#65f2f4,#258bff);
  color:#061827;
  font-size:22px;
  font-weight:bold;
}

.brand-name {
  font-size:19px;
  font-weight:bold;
}

.brand-sub {
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
}

button { cursor:pointer; }

.new-chat {
  padding:10px 13px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
}

main {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.welcome {
  margin:auto;
  text-align:center;
  max-width:600px;
  padding:25px 10px;
}

.welcome-icon {
  width:70px;
  height:70px;
  margin:0 auto 20px;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:var(--panel2);
  border:1px solid #35d6ee55;
  color:var(--cyan);
  font-size:30px;
  font-weight:bold;
}

.welcome h1 {
  font-size:30px;
  margin:0 0 10px;
}

.welcome p {
  color:var(--muted);
  margin:0;
}

.suggestions {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  margin-top:25px;
}

.suggestion {
  padding:10px 13px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--panel);
  color:#d5eaff;
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:22px 2px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.message {
  display:flex;
  align-items:flex-start;
  gap:10px;
  max-width:90%;
}

.message.user {
  align-self:flex-end;
  flex-direction:row-reverse;
}

.avatar {
  width:32px;
  height:32px;
  flex-shrink:0;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#123b55;
  color:var(--cyan);
  font-size:11px;
  font-weight:bold;
}

.user .avatar {
  background:#1d4e7d;
  color:white;
}

.bubble {
  padding:12px 15px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:5px 16px 16px 16px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.6;
}

.user .bubble {
  background:#123b60;
  border-radius:16px 5px 16px 16px;
}

.error { color:#ff9999; }

.composer-wrap {
  padding:12px 0 18px;
}

.composer {
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:10px;
  border:1px solid #31516e;
  border-radius:18px;
  background:var(--panel);
}

textarea {
  flex:1;
  min-width:0;
  min-height:42px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:15px;
  padding:10px 6px;
}

textarea::placeholder { color:#7892ad; }

.mic-button {
  width:43px;
  height:43px;
  flex-shrink:0;
  border:1px solid #31516e;
  border-radius:14px;
  background:#142d47;
  color:#7edff0;
  font-size:19px;
}

.mic-button.recording {
  background:#8b2635;
  color:white;
  border-color:#ff697d;
  animation:pulse 1.2s infinite;
}

.mic-button:disabled {
  opacity:.5;
  cursor:not-allowed;
}

@keyframes pulse {
  0% { box-shadow:0 0 0 0 #ff697d66; }
  70% { box-shadow:0 0 0 10px #ff697d00; }
  100% { box-shadow:0 0 0 0 #ff697d00; }
}

.send {
  width:44px;
  height:44px;
  flex-shrink:0;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#62edf0,#318dff);
  color:#061827;
  font-size:22px;
  font-weight:bold;
}

.send:disabled { opacity:.5; }

.mic-status {
  min-height:19px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding-top:7px;
}

.footnote {
  text-align:center;
  color:#7189a3;
  font-size:11px;
  padding-top:5px;
}

.hidden { display:none !important; }

@media(max-width:600px) {
  .app { padding:0 12px; }
  .message { max-width:96%; }
  .welcome h1 { font-size:26px; }
  .suggestion { font-size:12px; }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">D</div>
    <div>
      <div class="brand-name">
        DOA <span style="color:#35d6ee">3.0</span>
      </div>
      <div class="brand-sub">YOUR PERSONAL ASSISTANT</div>
    </div>
  </div>

  <button class="new-chat" id="newChat">＋ New chat</button>
</header>

<main>

<section class="welcome" id="welcome">
  <div class="welcome-icon">D</div>
  <h1>Welcome to DOA</h1>
  <p>Your best personal assistant. What can I help you with today?</p>

  <div class="suggestions">
    <button class="suggestion" data-prompt="Help me plan my day">Plan my day</button>
    <button class="suggestion" data-prompt="Help me manage my money">Manage my money</button>
    <button class="suggestion" data-prompt="Help me grow my business">Grow my business</button>
    <button class="suggestion" data-prompt="Explain something to me clearly">Learn something</button>
  </div>
</section>

<section class="messages hidden" id="messages"></section>

</main>

<div class="composer-wrap">

  <form class="composer" id="chatForm">

    <textarea
      id="messageInput"
      rows="1"
      placeholder="Message DOA..."
      aria-label="Message DOA"
    ></textarea>

    <button
      class="mic-button"
      id="micButton"
      type="button"
      aria-label="Start microphone"
      title="Speak to DOA"
    >🎙</button>

    <button
      class="send"
      id="sendButton"
      type="submit"
      aria-label="Send message"
    >↑</button>

  </form>

  <div class="mic-status" id="micStatus">
    Tap the microphone to speak to DOA.
  </div>

  <div class="footnote">
    DOA can make mistakes. Check important information.
  </div>

</div>
</div>

<script>
"use strict";

/* EXISTING DOA CLOUDFLARE WORKER */
const WORKER_URL =
"https://soft-frog-4cf8.doa2026app.workers.dev/";

const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const messagesEl = document.getElementById("messages");
const welcomeEl = document.getElementById("welcome");
const newChatButton = document.getElementById("newChat");

const micButton = document.getElementById("micButton");
const micStatus = document.getElementById("micStatus");

let history = [];
let busy = false;

/* ---------------------------------
   CHAT DISPLAY
--------------------------------- */

function showConversation() {
  welcomeEl.classList.add("hidden");
  messagesEl.classList.remove("hidden");
}

function addMessage(role, text) {
  showConversation();

  const row = document.createElement("div");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "YOU" : "D";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text || "";

  row.appendChild(avatar);
  row.appendChild(bubble);

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  return bubble;
}

function setBusy(value) {
  busy = value;
  sendButton.disabled = value;
  input.disabled = value;
  sendButton.textContent = value ? "…" : "↑";
}

/* ---------------------------------
   READ AI RESPONSE
--------------------------------- */

function extractText(data) {
  if (data == null) return "";

  if (typeof data === "string") return data;

  if (Array.isArray(data)) {
    return data.map(extractText).join("");
  }

  if (typeof data !== "object") return "";

  const fields = [
    "reply",
    "response",
    "answer",
    "text",
    "output",
    "delta",
    "content"
  ];

  for (const field of fields) {
    if (typeof data[field] === "string") {
      return data[field];
    }
  }

  if (data.candidates?.[0]?.content?.parts) {
    return data.candidates[0].content.parts
      .map(part => part.text || "")
      .join("");
  }

  if (data.choices?.[0]?.delta?.content) {
    return data.choices[0].delta.content;
  }

  if (data.choices?.[0]?.message?.content) {
    return data.choices[0].message.content;
  }

  if (data.result) return extractText(data.result);
  if (data.data) return extractText(data.data);

  return "";
}

async function readWorkerResponse(response, onUpdate) {
  const contentType =
    (response.headers.get("content-type") || "").toLowerCase();

  if (
    contentType.includes("application/json") ||
    !response.body ||
    !response.body.getReader
  ) {
    const raw = await response.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("The server returned an unreadable response.");
    }

    if (data.success === false || data.error) {
      throw new Error(data.error || data.details || "AI server error.");
    }

    const answer = extractText(data);

    if (!answer) {
      throw new Error("The AI server returned an empty answer.");
    }

    onUpdate(answer);
    return answer;
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();

  let buffer = "";
  let fullAnswer = "";
  const isSSE = contentType.includes("text/event-stream");

  function processEvent(event) {
    const lines = event.split(/\r?\n/);

    const dataLines = lines
      .filter(line => line.startsWith("data:"))
      .map(line => line.slice(5).trimStart());

    if (!dataLines.length) return;

    const dataText = dataLines.join("\n").trim();

    if (!dataText || dataText === "[DONE]") return;

    let chunk = "";

    try {
      const parsed = JSON.parse(dataText);

      if (parsed.error) throw new Error(parsed.error);

      chunk = extractText(parsed);

    } catch (error) {
      if (error instanceof SyntaxError) {
        chunk = dataText;
      } else {
        throw error;
      }
    }

    if (chunk) {
      fullAnswer += chunk;
      onUpdate(fullAnswer);
    }
  }

  while (true) {
    const result = await reader.read();

    if (result.done) break;

    buffer += decoder.decode(result.value, { stream:true });

    if (isSSE) {
      let boundary;

      while ((boundary = buffer.search(/\r?\n\r?\n/)) !== -1) {
        const event = buffer.slice(0, boundary);
        const separator = buffer.match(/\r?\n\r?\n/)[0];

        buffer = buffer.slice(boundary + separator.length);
        processEvent(event);
      }

    } else {
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop() || "";

      for (const line of lines) {
        const trimmed = line.trim();

        if (!trimmed) continue;

        if (trimmed.startsWith("data:")) {
          processEvent(trimmed);
          continue;
        }

        try {
          const parsed = JSON.parse(trimmed);

          if (parsed.error) throw new Error(parsed.error);

          const chunk = extractText(parsed);

          if (chunk) {
            fullAnswer += chunk;
            onUpdate(fullAnswer);
          }

        } catch (error) {
          if (!(error instanceof SyntaxError)) throw error;
        }
      }
    }
  }

  buffer += decoder.decode();

  if (buffer.trim()) {
    if (buffer.trim().startsWith("data:")) {
      processEvent(buffer);
    } else {
      try {
        const parsed = JSON.parse(buffer.trim());

        if (parsed.error) throw new Error(parsed.error);

        const finalText = extractText(parsed);

        if (finalText && !fullAnswer) {
          fullAnswer = finalText;
          onUpdate(fullAnswer);
        }
      } catch (error) {
        if (!(error instanceof SyntaxError)) throw error;
      }
    }
  }

  if (!fullAnswer) {
    throw new Error("The Worker stream ended without a readable answer.");
  }

  return fullAnswer;
}

/* ---------------------------------
   SEND CHAT MESSAGE
--------------------------------- */

async function sendMessage(message) {
  if (!message || busy) return;

  addMessage("user", message);

  const previousHistory = history.slice();

  history.push({
    role:"user",
    text:message
  });

  input.value = "";
  resizeInput();
  setBusy(true);

  const answerBubble = addMessage(
    "assistant",
    "DOA is thinking..."
  );

  try {
    const response = await fetch(WORKER_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json, text/event-stream"
      },
      body:JSON.stringify({
        message:message,
        prompt:message,
        history:previousHistory,
        messages:previousHistory
      })
    });

    if (!response.ok) {
      const raw = await response.text();
      let detail = raw;

      try {
        const data = JSON.parse(raw);
        detail =
          data.error ||
          data.details ||
          data.message ||
          raw;
      } catch {}

      throw new Error(detail || "Worker error: " + response.status);
    }

    answerBubble.textContent = "";

    const answer = await readWorkerResponse(
      response,
      text => {
        answerBubble.textContent = text;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    );

    answerBubble.textContent = answer;

    history.push({
      role:"assistant",
      text:answer
    });

  } catch (error) {
    answerBubble.classList.add("error");

    answerBubble.textContent =
      "I'm having trouble connecting right now. " +
      (error.message || "Please try again.");

    history = previousHistory;
  }

  setBusy(false);
  input.focus();
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ---------------------------------
   MICROPHONE / SPEECH RECOGNITION
--------------------------------- */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let isRecording = false;
let speechBaseText = "";

function setMicRecording(recording) {
  isRecording = recording;

  micButton.classList.toggle("recording", recording);

  micButton.textContent = recording ? "■" : "🎙";

  micButton.title = recording
    ? "Stop recording"
    : "Speak to DOA";
}

function startMicrophone() {
  if (busy) return;

  if (!SpeechRecognition) {
    micStatus.textContent =
      "Voice typing is not supported in this browser. Try Chrome on Android.";

    return;
  }

  if (isRecording) {
    stopMicrophone();
    return;
  }

  try {
    recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    speechBaseText = input.value.trim();

    micStatus.textContent = "Listening... Speak now.";

    setMicRecording(true);

    recognition.onresult = event => {
      let finalTranscript = "";
      let interimTranscript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {
        const transcript = event.results[i][0].transcript;

        if (event.results[i].isFinal) {
          finalTranscript += transcript;
        } else {
          interimTranscript += transcript;
        }
      }

      const spokenText =
        [speechBaseText, finalTranscript, interimTranscript]
          .filter(Boolean)
          .join(" ")
          .trim();

      input.value = spokenText;
      resizeInput();

      if (interimTranscript) {
        micStatus.textContent = "Hearing: " + interimTranscript;
      } else {
        micStatus.textContent = "Speech captured. You can continue speaking.";
      }
    };

    recognition.onerror = event => {
      let message = "Microphone error. Please try again.";

      if (event.error === "not-allowed" ||
          event.error === "service-not-allowed") {
        message =
          "Microphone permission was denied. Allow microphone access in your browser settings.";
      } else if (event.error === "no-speech") {
        message = "No speech detected. Tap the microphone and try again.";
      } else if (event.error === "network") {
        message =
          "Speech recognition needs an internet connection. Please check your connection.";
      } else if (event.error === "audio-capture") {
        message =
          "No microphone was detected. Check your device microphone.";
      }

      micStatus.textContent = message;
      setMicRecording(false);
    };

    recognition.onend = () => {
      setMicRecording(false);

      if (input.value.trim()) {
        micStatus.textContent =
          "Your speech is in the message box. Review it and press Send.";
      } else {
        micStatus.textContent =
          "Recording stopped. Tap the microphone to try again.";
      }
    };

    recognition.start();

  } catch (error) {
    setMicRecording(false);

    micStatus.textContent =
      "Could not start the microphone. Please try again.";
  }
}

function stopMicrophone() {
  if (recognition && isRecording) {
    recognition.stop();
  }

  setMicRecording(false);
}

micButton.addEventListener("click", () => {
  if (isRecording) {
    stopMicrophone();
  } else {
    startMicrophone();
  }
});

/* ---------------------------------
   INPUT AND NEW CHAT
--------------------------------- */

function resizeInput() {
  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight, 150) + "px";
}

form.addEventListener("submit", event => {
  event.preventDefault();

  if (isRecording) stopMicrophone();

  micStatus.textContent =
    "Tap the microphone to speak to DOA.";

  sendMessage(input.value.trim());
});

input.addEventListener("input", resizeInput);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    sendMessage(button.dataset.prompt || "");
  });
});

newChatButton.addEventListener("click", () => {
  if (isRecording) stopMicrophone();

  history = [];

  messagesEl.replaceChildren();
  messagesEl.classList.add("hidden");

  welcomeEl.classList.remove("hidden");

  input.value = "";
  resizeInput();

  micStatus.textContent =
    "Tap the microphone to speak to DOA.";
});

/* Browser security requires HTTPS for microphone access. */
if (!window.isSecureContext) {
  micStatus.textContent =
    "Microphone access requires a secure HTTPS website.";
}
</script>

</body>
</html>
