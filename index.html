
<script>
const WORKER_URL =
  "https://soft-frog-4cf8.doa2026app.workers.dev/";

const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const welcome = document.getElementById("welcome");
const suggestions = document.getElementById("suggestions");

let history = [];
let busy = false;

function showChat() {
  welcome.style.display = "none";
  suggestions.style.display = "none";
  chat.style.display = "flex";
}

function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "Y" : "D";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.append(avatar, bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;

  return row;
}

function ask(text) {
  promptBox.value = text;
  sendMessage();
}

async function sendMessage() {
  const message = promptBox.value.trim();

  if (!message || busy) return;

  showChat();
  addMessage("user", message);

  promptBox.value = "";
  busy = true;
  sendButton.disabled = true;

  const typing = addMessage("assistant", "DOA is thinking...");
  const bubble = typing.querySelector(".bubble");
  bubble.classList.add("typing");

  let answer = "";
  let buffer = "";

  function displayText(text) {
    if (!text) return;

    answer += text;
    bubble.textContent = answer;
    bubble.classList.remove("typing");
    chat.scrollTop = chat.scrollHeight;
  }

  function processEvent(line) {
    if (!line.startsWith("data:")) return;

    const dataText = line.slice(5).trim();

    if (!dataText || dataText === "[DONE]") return;

    try {
      const data = JSON.parse(dataText);

      if (data.error) {
        throw new Error(data.error.message || data.error);
      }

      const parts =
        data.candidates?.[0]?.content?.parts || [];

      for (const part of parts) {
        if (part.text) displayText(part.text);
      }
    } catch (error) {
      if (error.message && !error.message.includes("JSON")) {
        throw error;
      }
    }
  }

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        history
      })
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));

      throw new Error(
        errorData.details ||
        errorData.error ||
        "Server error: " + response.status
      );
    }

    const contentType =
      response.headers.get("content-type") || "";

    // Support a normal JSON response as a fallback.
    if (contentType.includes("application/json")) {
      const data = await response.json();

      const result =
        data.reply || data.response || data.answer ||
        data.text || data.output || "";

      if (!result) {
        throw new Error(data.error || "No answer received.");
      }

      displayText(result);
    } else {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { value, done } = await reader.read();

        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          processEvent(line.trim());
        }
      }

      buffer += decoder.decode();

      if (buffer.trim()) {
        processEvent(buffer.trim());
      }
    }

    if (!answer) {
      throw new Error("DOA received no text from the AI.");
    }

    bubble.classList.remove("typing");

    history.push(
      { role: "user", content: message },
      { role: "assistant", content: answer }
    );

  } catch (error) {
    bubble.classList.remove("typing");

    bubble.textContent = answer
      ? answer + "\n\n[Connection interrupted. Please try again.]"
      : "I'm having trouble connecting right now.\n\n" +
        error.message;

  } finally {
    busy = false;
    sendButton.disabled = false;
    promptBox.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

function newChat() {
  history = [];
  chat.innerHTML = "";
  chat.style.display = "none";
  welcome.style.display = "block";
  suggestions.style.display = "grid";
  promptBox.value = "";
}

promptBox.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
